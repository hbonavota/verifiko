name: CI

# Lint, tests and build for the API and the web app, on every PR to main and as a
# post-merge safety net on main. Needs no secrets and no external services. The
# DB migrations workflow (migrate.yml) is separate and unaffected.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Tests
        run: python -m pytest -q
      # Offline and deterministic: every network-backed layer is stubbed in
      # evaluation/offline_pipeline.py. Precision and false positive rate must not
      # regress (baseline 1.00 / 0.00 at the MEDIUM threshold).
      - name: Detection eval harness
        run: python -m evaluation.run_evaluation --min-precision 1.0 --max-fpr 0.0

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Warnings are allowed: react-hooks/exhaustive-deps is warn-only on purpose.
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
