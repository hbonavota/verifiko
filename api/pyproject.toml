[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiko-api"
version = "0.1.0"
description = "Verifiko verification API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "sqlalchemy>=2.0.39,<3.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "redis>=5.2.0,<6.0.0",
  "argon2-cffi>=25.1.0,<26.0.0",
  "boto3>=1.35.0,<2.0.0"
]

[project.optional-dependencies]
dev = [
  "alembic>=1.14.0,<2.0.0",
  "pytest>=8.4.0,<9.0.0",
  "httpx>=0.28.0,<1.0.0",
  "ruff>=0.17.0,<0.18.0",
  "black>=26.1.0,<27.0.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]
# Applied migrations are immutable; touching them also triggers the DB migrations workflow.
extend-exclude = "^/alembic/versions/"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E/F = pyflakes+pycodestyle, I = isort, UP = pyupgrade, B = bugbear, SIM = simplify.

[tool.ruff.lint.per-file-ignores]
# Black does not split string literals. The i18n catalogs hold full EN/ES sentences, and
# tests use long descriptive names and expected strings.
"app/domain/i18n/messages.py" = ["E501"]
"app/application/services/verification_text_localizer.py" = ["E501"]
"tests/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# api/alembic/ (migrations dir) would otherwise make the alembic package look first-party.
known-third-party = ["alembic"]
