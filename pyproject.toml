[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]
# Ignorar UP045 para Python 3.9 compatibility
ignore = ["UP045"]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
